name: assess-preservation-priorities
description: Rank heritage assets using explicit weighted user-supplied scores.
input_schema:
  type: object
  additionalProperties: false
  required: [assets]
  properties:
    assets:
      type: array
      minItems: 1
      items:
        type: object
        additionalProperties: true
    weights:
      type: object
      additionalProperties: false
      properties:
        condition_score:
          type: number
          minimum: 0
        significance_score:
          type: number
          minimum: 0
        exposure_score:
          type: number
          minimum: 0
        urgency_score:
          type: number
          minimum: 0
